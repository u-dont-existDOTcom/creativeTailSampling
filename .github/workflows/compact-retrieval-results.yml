name: Compact retrieval benchmark results

on:
  push:
    branches:
      - agent/exa-parallel-retrieval-ensemble
    paths:
      - '.github/workflows/compact-retrieval-results.yml'
      - 'analysis/retrieval_ensemble/compact_results.py'
      - 'tests/test_compact_retrieval_results.py'
      - 'analysis/retrieval_ensemble/results/round-001/raw/**'
      - 'analysis/retrieval_ensemble/results/round-001/query_manifest.json'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exa-parallel-retrieval-ensemble
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify compactor
        run: python -m pip install pytest && python -m pytest -q tests/test_compact_retrieval_results.py
      - name: Build compact evidence bundles
        run: python -m analysis.retrieval_ensemble.compact_results
      - name: Commit compact bundles
        run: |
          git config user.name 'creative-tail-sampling-bot'
          git config user.email 'creative-tail-sampling-bot@users.noreply.github.com'
          git add analysis/retrieval_ensemble/results/round-001/compact
          if git diff --cached --quiet; then
            echo 'No compact-result changes.'
            exit 0
          fi
          git commit -m 'benchmark: compact round-001 retrieval evidence'
          git push origin HEAD:agent/exa-parallel-retrieval-ensemble
